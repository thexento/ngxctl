[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ngxctl-cli"
version = "0.2.2"
description = "A modern command-line tool for generating, managing, and validating Nginx configurations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Xento" }
]
keywords = ["nginx", "cli", "devops", "webserver", "configuration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/thexento/ngxctl"
Repository = "https://github.com/thexento/ngxctl.git"

[project.scripts]
ngxctl = "ngxctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ngxctl"]